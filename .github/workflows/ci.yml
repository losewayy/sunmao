name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Preserve all main checks; only obsolete dev runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test
      - run: node --test crates/cli/src/serve/native-ui.test.cjs crates/cli/src/serve/settings-load.test.cjs crates/cli/src/serve/work-report.test.cjs crates/cli/src/serve/approval-ux.test.cjs
      - name: Browser Native UI E2E (Chrome)
        env:
          SUNMAO_BROWSER_TEST: '1'
        run: node --test crates/cli/src/serve/native-ui.browser.test.cjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- arch   # shape gate: god files, layer direction, prose-in-code
