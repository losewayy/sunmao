[workspace]
resolver = "2"
members = [
    "crates/llm",
    "crates/core",
    "crates/cli",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/losewayy/sunmao"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
deno_task_shell = "0.27"
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "fs", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
