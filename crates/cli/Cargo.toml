[package]
name = "sunmao"
description = "sunmao CLI — agent harness kernel frontend"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sunmao"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "2.2.0", features = ["unstable_protocol_v2"] }
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
tracing = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
reqwest.workspace = true
rfd = "0.16"
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sunmao-core = { path = "../core", version = "0.2.0" }
sunmao-llm = { path = "../llm", version = "0.2.0" }
tokio.workspace = true
tokio-stream.workspace = true
# WS client for the IM long-connection adapters (feishu/qq). Already in the
# tree as a transitive dep of axum's ws feature; the explicit declaration
# pins the client half (connect + rustls through the roots reqwest uses).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing-subscriber.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2.2"

zip = "4.6"

