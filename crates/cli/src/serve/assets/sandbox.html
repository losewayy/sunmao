<!doctype html>
<html>
<head><meta charset="utf-8"><title>sunmao mcp-app sandbox</title></head>
<body>
<script>
/* MCP Apps sandbox proxy (SEP-1865 §"Sandbox proxy").
 *
 * This page lives on a DIFFERENT origin than the host (own listener port —
 * the spec requires cross-origin isolation between host and view content).
 * Duties:
 *   1. announce readiness: postMessage "ui/notifications/sandbox-proxy-ready"
 *   2. on "ui/notifications/sandbox-resource-ready": build the inner View
 *      iframe (sandbox="allow-scripts" — opaque origin, no same-origin) with
 *      the HTML in srcdoc + a <meta> CSP built from the declared domains
 *   3. forward every other message host↔view verbatim
 */
const inner = { el: null, ready: false };
let host = null; // event.source of the host window

function buildCsp(csp) {
  const cd = (csp && csp.connectDomains) || [];
  const rd = (csp && csp.resourceDomains) || [];
  const fd = (csp && csp.frameDomains) || [];
  const bd = (csp && csp.baseUriDomains) || [];
  const j = a => (a && a.length ? ' ' + a.join(' ') : '');
  return [
    `default-src 'none'`,
    `script-src 'unsafe-inline'${j(rd)}`,
    `style-src 'unsafe-inline'${j(rd)}`,
    `img-src data:${j(rd)}`,
    `media-src data:${j(rd)}`,
    `font-src data:${j(rd)}`,
    `connect-src 'none'${j(cd)}`,
    `frame-src 'none'${j(fd)}`,
    `base-uri 'self'${j(bd)}`,
    `object-src 'none'`,
  ].join('; ');
}

function mount(html, csp) {
  if (inner.el) inner.el.remove();
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts'); // opaque origin, no storage
  const meta = `<meta http-equiv="Content-Security-Policy" content="${buildCsp(csp).replace(/"/g, '&quot;')}">`;
  f.srcdoc = /<head[^>]*>/i.test(html)
    ? html.replace(/<head[^>]*>/i, m => m + meta)
    : meta + html;
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
  document.body.appendChild(f);
  inner.el = f;
}

window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d || d.jsonrpc !== '2.0') return;
  // host → view direction: events from the parent window
  if (ev.source === window.parent) {
    host = window.parent;
    if (d.method === 'ui/notifications/sandbox-resource-ready') {
      mount(d.params && d.params.html || '', d.params && d.params.csp);
      return;
    }
    // forward everything else into the View
    if (inner.el && inner.el.contentWindow) {
      inner.el.contentWindow.postMessage(d, '*');
    }
    return;
  }
  // view → host direction: events from the inner iframe
  if (inner.el && ev.source === inner.el.contentWindow && host) {
    host.postMessage(d, '*');
  }
});

// ready signal — the host sends the resource only after this lands
window.parent.postMessage(
  { jsonrpc: '2.0', method: 'ui/notifications/sandbox-proxy-ready', params: {} },
  '*'
);
</script>
</body>
</html>
