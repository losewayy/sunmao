[package]
name = "sunmao-core"
description = "sunmao kernel: event-sourced sessions, tool registry, agent loop, seams"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
deno_task_shell.workspace = true
futures-util.workspace = true
glob = "0.3"
reqwest = { workspace = true, features = ["rustls"] }
rmcp = { version = "3.5.0", features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# PTC/codemode engine for `RunCode` — embeds QuickJS (compiles its C source
# via the cc build, so builds get slower once, then cached). "futures" gives
# Rust-Future↔JS-Promise bridging; no loader feature = no import/require.
rquickjs = { version = "0.14", features = ["futures"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sunmao-llm = { path = "../llm", version = "0.1.10" }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# spawnfate — the shell/preflight engine. Its model is Windows-only; the
# preflight module no-ops elsewhere.
spawnfate = "0.1"
# GetOEMCP + MultiByteToWideChar for `console_text`'s OEM-codepage decode.
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
