[package]
name = "sunmao-core"
description = "sunmao kernel: event-sourced sessions, tool registry, agent loop, seams"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
deno_task_shell.workspace = true
futures-util.workspace = true
glob = "0.3"
reqwest = { workspace = true, features = ["rustls"] }
rmcp = { version = "3.5.0", features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
sunmao-llm = { path = "../llm" }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# spawnfate — the shell/preflight engine. Its model is Windows-only; the
# preflight module no-ops elsewhere. Pinned to the v1.0.0 commit; swap to
# `version = "1"` once spawnfate 1.0 is on crates.io.
spawnfate = { git = "https://github.com/losewayy/spawnfate", rev = "0c029fd57f98b49f0245e8436dcf6ffeb492ed3c" }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
