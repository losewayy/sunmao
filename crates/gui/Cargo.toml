[package]
name = "sunmao-gui"
description = "sunmao desktop shell — Tauri v2 window over the embedded serve host"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
sunmao = { path = "../cli" }
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.1"
tauri-plugin-window-state = "2.5.0"
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# AllocConsole + ShowWindow: under `windows_subsystem="windows"` we have
# no console — every shell child (deno_task_shell spawn, pwsh) would get
# a FRESH console window in the user's face. Allocating one hidden
# console gives children something to inherit without ever showing it.
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
